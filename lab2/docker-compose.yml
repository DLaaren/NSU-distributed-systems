services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: coordinator_user
      POSTGRES_PASSWORD: coordinator_password
      POSTGRES_DB: coordinator_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator_user -d coordinator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: coordinator_main/Dockerfile
    container_name: coordinator
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: coordinator_user
      DB_PASSWORD: coordinator_password
      DB_NAME: coordinator_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: worker_main/Dockerfile
    environment:
      - COORDINATOR_ADDRESS=http://coordinator:8080
    depends_on:
      - coordinator
    networks:
      - app-network
    scale: 2

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: