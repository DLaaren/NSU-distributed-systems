services:
  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    user: postgres
    environment:
      POSTGRES_USER: coordinator_user
      POSTGRES_PASSWORD: coordinator_password
      POSTGRES_DB: coordinator_db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicatepass
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator_user -d coordinator_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on

  postgres-replica:
    image: postgres:16-alpine
    container_name: postgres-replica
    user: postgres
    environment:
      POSTGRES_USER: coordinator_user
      POSTGRES_PASSWORD: coordinator_password
      POSTGRES_DB: coordinator_db
      POSTGRES_PORT: 5433 
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5433:5433"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator_user -d coordinator_db && pg_is_in_recovery()"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    command: >
      bash -c '
        # Wait for primary to be ready
        until pg_isready -h postgres-primary -p 5432 -U coordinator_user -d coordinator_db; do
          echo "Waiting for primary to be ready..."
          sleep 2
        done
        
        # Clean replica data directory if it exists
        if [ -f /var/lib/postgresql/data/postmaster.pid ]; then
          rm -rf /var/lib/postgresql/data/*
        fi
        
        # Perform base backup
        pg_basebackup -h postgres-primary -p 5432 -U replicator -D /var/lib/postgresql/data -P -R -X stream -C -S replica_slot
        
        # Start PostgreSQL
        exec postgres -c port=5433 -c hot_standby=on
      '
